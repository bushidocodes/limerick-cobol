name: checks

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    checks:
        name: Validate and links
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: "22"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            # Skip on non-fork PRs: the auto-format workflow commits prettier
            # fixes back to the branch, so format:check would race it and fail.
            # For fork PRs and direct pushes to master, auto-format doesn't run,
            # so the check is still needed.
            - if: |
                  github.event_name == 'push' ||
                  github.event.pull_request.head.repo.full_name != github.repository
              run: pnpm run format:check
            - run: pnpm run validate
            - run: pnpm run check:lesson-index
            - run: pnpm run check:assets
            - run: pnpm run check:img-dims
            - run: pnpm run links
            # Accessibility (pa11y) is intentionally NOT run here — it is slow
            # and must not block PRs. Run `npm run a11y` locally instead. A
            # scheduled weekly job (.github/workflows/a11y-full.yml) runs the
            # full scan as a non-blocking safety net.

    typos:
        name: Spell check (typos)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: crate-ci/typos@v1.47.0
