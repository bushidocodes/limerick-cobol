name: checks

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    checks:
        name: Validate and links
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: "22"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            # Skip on non-fork PRs: the auto-format workflow commits Biome
            # fixes back to the branch, so format:check would race it and fail.
            # For fork PRs and direct pushes to master, auto-format doesn't run,
            # so the check is still needed.
            - if: |
                  github.event_name == 'push' ||
                  github.event.pull_request.head.repo.full_name != github.repository
              run: pnpm run format:check
            # Same fork/push condition as format:check — auto-format may still
            # be rewriting the branch on non-fork PRs.
            - if: |
                  github.event_name == 'push' ||
                  github.event.pull_request.head.repo.full_name != github.repository
              run: pnpm run lint
            - run: pnpm run validate
            - run: pnpm run check:lesson-index
            - run: pnpm run check:assets
            - run: pnpm run check:img-dims
            - run: pnpm run links
            # Accessibility (pa11y) is intentionally NOT run here — it is slow
            # and must not block PRs. Run `npm run a11y` locally instead. A
            # scheduled weekly job (.github/workflows/a11y-full.yml) runs the
            # full scan as a non-blocking safety net.

    typos:
        name: Spell check (typos)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: crate-ci/typos@v1.49.0
