name: auto-format

# Regenerates derived files (sitemap, examples HTML, search index, image
# dimensions) and runs Biome format on every PR, committing any changes back to
# the PR branch. Skips PRs from forks because GITHUB_TOKEN can't push to forked
# repos — fork contributors will see `format:check` fail and need to run
# `pnpm run format:write` locally before pushing.
#
# Token choice (important):
#   Prefer secrets.AUTO_FORMAT_TOKEN (a classic or fine-grained PAT from a
#   maintainer with contents:write). Pushes authenticated as github-actions[bot]
#   via GITHUB_TOKEN cause subsequent workflow runs on the PR to sit in
#   "awaiting approval" under GitHub's mid-2026 policy for bot-updated PRs
#   (even same-repo branches). A human PAT re-triggers CI without approval.
#   Fallback to github.token keeps the job working if the secret is missing,
#   but you will need to Approve the follow-up checks manually.

on:
    pull_request:
        branches: [master]

concurrency:
    group: format-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    regenerate:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.head_ref }}
                  # Prefer maintainer PAT so the push is not github-actions[bot].
                  token: ${{ secrets.AUTO_FORMAT_TOKEN || github.token }}
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: "22"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - run: pnpm run build:sitemap
            - name: Commit sitemap if changed
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git add sitemap.xml
                    git commit -m "chore: auto-regenerate sitemap.xml"
                  fi

            # build:examples must run before build:search-index (the index reads
            # titles/descriptions from examples HTML) and before
            # add-img-dimensions (which patches missing <img> dims).
            - run: pnpm run build:examples
            - name: Commit examples if changed
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git add examples/
                    git commit -m "chore: auto-regenerate examples HTML from .cbl sources"
                  fi

            - run: pnpm run build:search-index
            - name: Commit search index if changed
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git add search-index.json
                    git commit -m "chore: auto-regenerate search-index.json"
                  fi

            - run: pnpm run fix:img-dims
            - name: Commit image dimensions if changed
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git add -A
                    git commit -m "chore: auto-add missing <img> width/height"
                  fi

            - run: pnpm run format:write
            - name: Commit Biome format changes if any
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git add -A
                    git commit -m "style: auto-format with biome"
                  fi

            - name: Push
              run: git push
